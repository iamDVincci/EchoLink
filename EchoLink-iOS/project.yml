name: EchoLink
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "2.4.0"
    CURRENT_PROJECT_VERSION: "24"
targets:
  EchoLink:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: EchoLink
    info:
      path: EchoLink/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.echolink
        INFOPLIST_FILE: EchoLink/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
